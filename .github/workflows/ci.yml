name: CI — Lint, Build & Sandbox

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  # No paths-ignore on PRs: these checks are required by the "Protect main"
  # ruleset, and a skipped workflow would leave docs-only PRs blocked forever.
  pull_request:
    branches: [main, develop]

permissions:
  contents: read    # CI only reads the repo

env:
  # onnxruntime-node (pulled in by @huggingface/transformers) tries to download
  # CUDA GPU binaries on Linux x64; CI has no GPU and the webview never uses them.
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. LINT & TYPECHECK
  #    Fast gate — catches style and type errors before the expensive build.
  # ─────────────────────────────────────────────────────────────────────────────
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install extension dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Typecheck extension
        run: npx tsc --noEmit -p tsconfig.json

      - name: Install webview dependencies
        run: cd webview-ui && npm ci

      - name: Typecheck webview
        run: cd webview-ui && npx tsc --noEmit -p tsconfig.json

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. BUILD
  #    Compiles the extension host and bundles the Webview UI.
  #    Uploads compiled artefacts so downstream jobs don't re-compile.
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install extension dependencies
        run: npm ci

      - name: Build Webview UI
        run: npm run build:webview

      - name: Compile extension host (TypeScript)
        run: npm run compile

      - name: Fetch tree-sitter grammars
        run: npm run grammars

      # Parser/resolver golden tests: plain Node, no VS Code needed.
      - name: Unit tests
        run: npx mocha --ui tdd "out/test/unit/**/*.test.js"

      # Webview pure modules (phrase chunker); Node 22.18+ strips TS types natively.
      - name: Webview unit tests
        run: npm run test:webview

      - name: Upload compiled artefacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-output-${{ github.sha }}
          path: |
            out/
            webview-ui/dist/
          retention-days: 3

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. PACKAGE
  #    Packages the extension into a .vsix and verifies critical files are
  #    present. The VSIX artefact is kept for manual inspection / QA download.
  # ─────────────────────────────────────────────────────────────────────────────
  package:
    name: Package Extension
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install extension dependencies
        run: npm ci

      - name: Restore compiled artefacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: build-output-${{ github.sha }}

      - name: Package VSIX (skip prepublish — already built)
        env:
          CI: 'true'
        run: npx @vscode/vsce package --no-dependencies --no-git-tag-version

      - name: Verify package contents
        run: |
          VSIX=$(ls *.vsix | head -1)
          echo "::notice::Packaged VSIX: $VSIX ($(du -sh "$VSIX" | cut -f1))"

          npx @vscode/vsce ls --no-dependencies | tee package-manifest.txt

          echo "--- Verifying required files are present ---"
          required_files=(
            "out/extension.js"
            "package.json"
            "README.md"
            "parsers/web-tree-sitter.cjs"
            "parsers/web-tree-sitter.wasm"
            "parsers/tree-sitter-typescript.wasm"
            "parsers/tree-sitter-python.wasm"
          )
          for f in "${required_files[@]}"; do
            if grep -q "$f" package-manifest.txt; then
              echo "  ✓  $f"
            else
              echo "  ✗  MISSING: $f"
              exit 1
            fi
          done

          echo "--- Verifying sensitive files are excluded ---"
          excluded_patterns=(
            "src/"
            ".github/"
            "node_modules/"
            "tsconfig.json"
            ".eslintrc"
            "test-fixtures/"
            "out/test/"
          )
          for p in "${excluded_patterns[@]}"; do
            if grep -q "$p" package-manifest.txt; then
              echo "  ✗  SHOULD BE EXCLUDED: $p"
              exit 1
            else
              echo "  ✓  excluded: $p"
            fi
          done

      - name: Upload VSIX artefact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codearchy-vsix-${{ github.sha }}
          path: '*.vsix'
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. SANDBOX
  #    Launches VS Code (downloaded by @vscode/test-electron) in a headless
  #    environment, loads the extension from source, and runs the smoke-test
  #    suite across all three target platforms.
  # ─────────────────────────────────────────────────────────────────────────────
  sandbox:
    name: Sandbox (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install extension dependencies
        run: npm ci

      - name: Restore compiled artefacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: build-output-${{ github.sha }}

      # Linux requires a virtual framebuffer — VS Code's Electron renderer needs
      # a display server even in headless CI.
      - name: Install Xvfb (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libgbm-dev xvfb

      - name: Run sandbox tests — Linux (Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" npm test
        env:
          DISPLAY: ':99.0'

      - name: Run sandbox tests — macOS / Windows
        if: runner.os != 'Linux'
        run: npm test
