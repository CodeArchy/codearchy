name: CI — Lint, Build & Sandbox

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  # No paths-ignore on PRs: these checks are required by the "Protect main"
  # ruleset, and a skipped workflow would leave docs-only PRs blocked forever.
  pull_request:
    branches: [main, develop]

permissions:
  contents: read    # CI only reads the repo

env:
  # onnxruntime-node (pulled in by @huggingface/transformers) tries to download
  # CUDA GPU binaries on Linux x64; CI has no GPU and the webview never uses them.
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip
  # Corepack provides the pnpm version pinned in package.json#packageManager.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. LINT & TYPECHECK
  #    Fast gate — catches style and type errors before the expensive build.
  # ─────────────────────────────────────────────────────────────────────────────
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/vscode
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Enable pnpm (Corepack, version from package.json)
        run: corepack enable

      - name: Install dependencies (pnpm workspace)
        run: pnpm install --frozen-lockfile

      # Turborepo at the workspace root: builds each package's dependencies first.
      - name: Lint (ESLint)
        run: pnpm -w run lint

      - name: Typecheck (all packages, extension and webview)
        run: pnpm -w run typecheck

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. BUILD
  #    Compiles the extension host and bundles the Webview UI.
  #    Uploads compiled artefacts so downstream jobs don't re-compile.
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-typecheck
    defaults:
      run:
        working-directory: apps/vscode
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Enable pnpm (Corepack, version from package.json)
        run: corepack enable

      - name: Install dependencies (pnpm workspace)
        run: pnpm install --frozen-lockfile

      # Builds every package in dependency order: protocol → sdk → core →
      # treesitter/grammars → platform-node → extension bundle (+ parsers/) and webview.
      - name: Build workspace
        run: pnpm -w run build

      # core + platform-node (extraction, resolution, graph; Vitest), the extension's
      # voice store (mocha) and the webview's pure modules (node --test).
      - name: Unit tests
        run: pnpm -w run test

      - name: Upload compiled artefacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-output-${{ github.sha }}
          path: |
            apps/vscode/dist/
            apps/vscode/parsers/
            apps/vscode/webview-ui/dist/
          retention-days: 3

  # ─────────────────────────────────────────────────────────────────────────────
  # 2b. BROWSER CONFORMANCE
  #     The shared adapter conformance suite in Chromium, Firefox and WebKit
  #     (Playwright, no COOP/COEP): OPFS file access, SQLite WASM on OPFS,
  #     tree-sitter from fetched wasm, the Web Worker parse pool, and the
  #     golden polyglot graph, which Node reproduces in the Build job.
  # ─────────────────────────────────────────────────────────────────────────────
  browser-conformance:
    name: Browser conformance
    runs-on: ubuntu-latest
    needs: lint-typecheck
    defaults:
      run:
        working-directory: packages/platform-browser
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Enable pnpm (Corepack, version from package.json)
        run: corepack enable

      - name: Install dependencies (pnpm workspace)
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -w exec turbo run build --filter=@codearchy/platform-browser... --filter=@codearchy/conformance... --filter=@codearchy/grammars --filter=@codearchy/playground...

      - name: Install browsers (Chromium, Firefox, WebKit)
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run the conformance suite in all three engines
        env:
          CONFORMANCE_TIMEOUT_MS: '180000'
        run: pnpm run test:browser

      - name: Playground smoke test (sample, search, OPFS warm reload) in all three engines
        run: pnpm --filter @codearchy/playground exec node test/smoke.mjs

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. PACKAGE
  #    Packages the extension into a .vsix and verifies critical files are
  #    present. The VSIX artefact is kept for manual inspection / QA download.
  # ─────────────────────────────────────────────────────────────────────────────
  package:
    name: Package Extension
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: apps/vscode
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Enable pnpm (Corepack, version from package.json)
        run: corepack enable

      - name: Install dependencies (pnpm workspace)
        run: pnpm install --frozen-lockfile

      - name: Restore compiled artefacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: build-output-${{ github.sha }}
          path: apps/vscode

      - name: Package VSIX (skip prepublish — already built)
        env:
          CI: 'true'
        run: pnpm exec vsce package --no-dependencies --no-git-tag-version

      - name: Verify package contents
        run: |
          VSIX=$(ls *.vsix | head -1)
          echo "::notice::Packaged VSIX: $VSIX ($(du -sh "$VSIX" | cut -f1))"

          pnpm exec vsce ls --no-dependencies | tee package-manifest.txt

          echo "--- Verifying required files are present ---"
          required_files=(
            "dist/extension.js"
            "package.json"
            "README.md"
            "parsers/web-tree-sitter.wasm"
            "parsers/tree-sitter-typescript.wasm"
            "parsers/tree-sitter-python.wasm"
          )
          for f in "${required_files[@]}"; do
            if grep -q "$f" package-manifest.txt; then
              echo "  ✓  $f"
            else
              echo "  ✗  MISSING: $f"
              exit 1
            fi
          done

          echo "--- Verifying sensitive files are excluded ---"
          excluded_patterns=(
            "src/"
            ".github/"
            "node_modules/"
            "tsconfig.json"
            ".eslintrc"
            "fixtures/"
            "out/"
          )
          for p in "${excluded_patterns[@]}"; do
            if grep -q "$p" package-manifest.txt; then
              echo "  ✗  SHOULD BE EXCLUDED: $p"
              exit 1
            else
              echo "  ✓  excluded: $p"
            fi
          done

      - name: Upload VSIX artefact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codearchy-vsix-${{ github.sha }}
          path: apps/vscode/*.vsix
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. SANDBOX
  #    Launches VS Code (downloaded by @vscode/test-electron) in a headless
  #    environment, loads the extension from source, and runs the smoke-test
  #    suite across all three target platforms.
  # ─────────────────────────────────────────────────────────────────────────────
  sandbox:
    name: Sandbox (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Enable pnpm (Corepack, version from package.json)
        run: corepack enable

      - name: Install dependencies (pnpm workspace)
        run: pnpm install --frozen-lockfile

      - name: Restore compiled artefacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: build-output-${{ github.sha }}
          path: apps/vscode

      # Linux requires a virtual framebuffer — VS Code's Electron renderer needs
      # a display server even in headless CI.
      - name: Install Xvfb (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libgbm-dev xvfb

      # Must run in apps/vscode: the root `test` script is the unit-test suite,
      # not the VS Code extension-host tests.
      - name: Run sandbox tests — Linux (Xvfb)
        if: runner.os == 'Linux'
        working-directory: apps/vscode
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" pnpm run test
        env:
          DISPLAY: ':99.0'

      - name: Run sandbox tests — macOS / Windows
        if: runner.os != 'Linux'
        working-directory: apps/vscode
        run: pnpm run test
