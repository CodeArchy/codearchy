name: Publish — VS Code Marketplace

on:
  push:
    tags:
      # Matches: v1.0.0, v2.3.1, v10.0.0-rc.1 etc.
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

  # Allow a manual trigger with an optional pre-release flag
  workflow_dispatch:
    inputs:
      pre_release:
        description: 'Publish as pre-release?'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: read    # least privilege by default; jobs that need more request it explicitly

env:
  # onnxruntime-node (pulled in by @huggingface/transformers) tries to download
  # CUDA GPU binaries on Linux x64; CI has no GPU and the webview never uses them.
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip
  # Corepack provides the pnpm version pinned in package.json#packageManager.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. VALIDATE
  #    Gates the entire pipeline. Ensures the release tag is consistent with
  #    package.json and that the CHANGELOG has been updated before anything
  #    reaches the Marketplace.
  # ─────────────────────────────────────────────────────────────────────────────
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    defaults:
      run:
        working-directory: apps/vscode
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0      # need full history for changelog diff

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Extract version metadata
        id: meta
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

          # Pre-release: the workflow input, or a tag with a suffix (v2.0.0-beta publishes
          # package.json's 2.0.0 to the pre-release channel: the Marketplace takes plain
          # x.y.z versions only, with pre-release as a flag).
          WF_INPUT="${{ github.event.inputs.pre_release }}"
          if [[ "$WF_INPUT" == "true" ]] || [[ "$GITHUB_REF_NAME" == v*-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          TAG_VERSION="${TAG_VERSION%%-*}"   # v2.0.0-beta → 2.0.0
          PKG_VERSION="${{ steps.meta.outputs.version }}"

          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            echo "  Bump the version in package.json to match the tag before publishing."
            exit 1
          fi
          echo "::notice::Version check passed: $PKG_VERSION"

      - name: Check CHANGELOG is updated for this version
        run: |
          VERSION="${{ steps.meta.outputs.version }}"

          # Expect a section header like: ## [1.2.3] or ## [1.2.3] - 2024-01-15
          if ! grep -qE "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for version $VERSION."
            echo "  Add a '## [$VERSION]' section to CHANGELOG.md before publishing."
            exit 1
          fi
          echo "::notice::CHANGELOG entry found for $VERSION"

      - name: Verify CHANGELOG entry is not empty
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          # Extract lines between this version header and the next ## section
          ENTRY=$(awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)

          if [ -z "$(echo "$ENTRY" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG entry for $VERSION exists but is empty. Document your changes."
            exit 1
          fi
          echo "::notice::CHANGELOG entry is non-empty."

      - name: Ensure no uncommitted local changes slipped in
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if ! git diff --quiet HEAD; then
            echo "::error::Working tree is dirty — commit all changes before tagging."
            git diff --stat HEAD
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. BUILD
  #    Full production build (extension host + Webview UI).
  #    Runs only after validate passes.
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: validate
    defaults:
      run:
        working-directory: apps/vscode
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Enable pnpm (Corepack, version from package.json)
        run: corepack enable

      - name: Install dependencies (pnpm workspace)
        run: pnpm install --frozen-lockfile

      - name: Build workspace (packages, extension bundle, parsers, webview)
        run: pnpm -w run build

      - name: Upload build artefacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: publish-build-${{ github.sha }}
          path: |
            apps/vscode/dist/
            apps/vscode/parsers/
            apps/vscode/webview-ui/dist/
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. PACKAGE
  #    Creates the release .vsix and runs a final content audit.
  # ─────────────────────────────────────────────────────────────────────────────
  package:
    name: Package VSIX
    runs-on: ubuntu-latest
    needs: build
    outputs:
      vsix_name: ${{ steps.vsix_meta.outputs.vsix_name }}
    defaults:
      run:
        working-directory: apps/vscode
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Enable pnpm (Corepack, version from package.json)
        run: corepack enable

      - name: Install dependencies (pnpm workspace)
        run: pnpm install --frozen-lockfile

      - name: Restore build artefacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: publish-build-${{ github.sha }}
          path: apps/vscode

      - name: Package VSIX
        env:
          CI: 'true'
        run: |
          PRE_FLAG=""
          if [ "${{ needs.validate.outputs.is_prerelease }}" == "true" ]; then
            PRE_FLAG="--pre-release"
          fi
          pnpm exec vsce package --no-dependencies $PRE_FLAG

      - name: Capture VSIX filename
        id: vsix_meta
        run: |
          VSIX_FILE=$(ls *.vsix | head -1)
          echo "vsix_name=$VSIX_FILE" >> "$GITHUB_OUTPUT"
          echo "::notice::Release VSIX: $VSIX_FILE ($(du -sh "$VSIX_FILE" | cut -f1))"

      - name: Audit package contents
        run: |
          echo "--- Full package manifest ---"
          pnpm exec vsce ls --no-dependencies | tee package-manifest.txt

          required_files=("dist/extension.js" "dist/parseWorker.js" "package.json" "README.md" "CHANGELOG.md"
                          "parsers/web-tree-sitter.wasm"
                          "webview-ui/dist/webview.js" "webview-ui/dist/elk-worker.js")
          # Every pinned grammar must ship.
          while IFS= read -r f; do required_files+=("parsers/$f"); done < <(
            node -e "for (const g of require('../../packages/grammars/grammars.json').grammars) for (const f of g.files) console.log(f)"
          )
          echo "--- Required files ---"
          for f in "${required_files[@]}"; do
            if grep -q "$f" package-manifest.txt; then
              echo "  ✓  $f"
            else
              echo "  ✗  MISSING: $f" && exit 1
            fi
          done

          excluded_patterns=("src/" ".github/" "node_modules/" "tsconfig.json" ".eslintrc" "fixtures/" "out/")
          echo "--- Must-be-excluded ---"
          for p in "${excluded_patterns[@]}"; do
            if grep -q "$p" package-manifest.txt; then
              echo "  ✗  LEAKED: $p" && exit 1
            else
              echo "  ✓  clean: $p"
            fi
          done

      - name: Upload release VSIX
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-vsix
          path: apps/vscode/*.vsix
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────────
  # 4a. PUBLISH — VS Code Marketplace
  #     Authenticates with Marketplace Trusted Publishing (GitHub OIDC), so no
  #     stored token is needed. The trusted-publishing policy on the publisher is
  #     bound to: CodeArchy/codearchy · publish.yml · environment "marketplace".
  #     Falls back to the VSCE_PAT environment secret only if OIDC fails.
  # ─────────────────────────────────────────────────────────────────────────────
  publish-marketplace:
    name: Publish to VS Code Marketplace
    runs-on: ubuntu-latest
    needs: [validate, package]
    environment: marketplace     # approval gate (maintainers) + must match the trusted-publishing policy
    permissions:
      contents: read
      id-token: write            # lets vsce request a GitHub OIDC token for Trusted Publishing
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Download release VSIX
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-vsix

      - name: Publish to Marketplace
        env:
          VSIX_FILE: ${{ needs.package.outputs.vsix_name }}
          IS_PRERELEASE: ${{ needs.validate.outputs.is_prerelease }}
          FALLBACK_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          # vsce >= 4 is required for --oidc; pinned for reproducible releases.
          VSCE="npx --yes @vscode/vsce@4.1.1"
          PRE_FLAG=""
          if [ "$IS_PRERELEASE" == "true" ]; then
            PRE_FLAG="--pre-release"
          fi

          if $VSCE publish --oidc --packagePath "$VSIX_FILE" $PRE_FLAG; then
            echo "::notice::Published via Trusted Publishing (OIDC)."
          elif [ -n "$FALLBACK_PAT" ]; then
            echo "::warning::Trusted Publishing failed; falling back to the VSCE_PAT secret. Check the publisher's trusted-publishing policy."
            VSCE_PAT="$FALLBACK_PAT" $VSCE publish --packagePath "$VSIX_FILE" $PRE_FLAG
          else
            echo "::error::Trusted Publishing failed and no VSCE_PAT fallback secret is configured."
            exit 1
          fi

      - name: Confirm publish
        run: |
          echo "::notice::CodeArchy v${{ needs.validate.outputs.version }} successfully published to the VS Code Marketplace."

  # ─────────────────────────────────────────────────────────────────────────────
  # 4b. PUBLISH — Open VSX Registry (VSCodium / Eclipse Theia / Gitpod users)
  #     Optional: remove this job if you do not maintain an Open VSX listing.
  #     Requires the OVSX_PAT secret.
  # ─────────────────────────────────────────────────────────────────────────────
  publish-ovsx:
    name: Publish to Open VSX
    runs-on: ubuntu-latest
    needs: [validate, package]
    environment: marketplace
    # Skip if OVSX_PAT is not configured — safe to leave in place
    if: ${{ vars.PUBLISH_OVSX == 'true' }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Download release VSIX
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-vsix

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          VSIX_FILE: ${{ needs.package.outputs.vsix_name }}
        run: |
          npx --yes ovsx@1.4.0 publish "$VSIX_FILE" --pat "$OVSX_PAT"

  # ─────────────────────────────────────────────────────────────────────────────
  # 5. GITHUB RELEASE
  #    Creates a tagged GitHub Release and attaches the .vsix as a download
  #    asset. Release notes are extracted from the CHANGELOG entry.
  # ─────────────────────────────────────────────────────────────────────────────
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate, package, publish-marketplace]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write   # the only job allowed to write: creates the GitHub Release
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download release VSIX
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-vsix

      - name: Extract CHANGELOG notes for this release
        id: release_notes
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          # Grab lines between this version header and the next ## section
          NOTES=$(awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found{print}" apps/vscode/CHANGELOG.md)
          # Write to file so the release action can read it (avoids shell escaping issues)
          echo "$NOTES" > release-notes.md
          echo "Release notes extracted ($(wc -l < release-notes.md) lines)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: CodeArchy v${{ needs.validate.outputs.version }}
          body_path: release-notes.md
          prerelease: ${{ needs.validate.outputs.is_prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: |
            *.vsix
