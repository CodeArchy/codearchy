name: Publish — npm (codearchy CLI)

# Publishes the `codearchy` npm package (apps/cli, bundled by apps/cli/scripts/package.mjs).
# A tag cli-vX.Y.Z publishes version X.Y.Z (it must match apps/cli/package.json);
# cli-vX.Y.Z-next.N style tags publish to the `next` dist-tag instead of `latest`.
#
# Authentication: npm trusted publishing (OIDC). No npm token is stored in this
# repository: npm trusts this workflow file, in this repository, as configured on
# the package's settings page on npmjs.com. Provenance is attached automatically.
#
# Then the `mcp-registry` job lists that version in the official MCP Registry
# (registry.modelcontextprotocol.io) as io.github.CodeArchy/codearchy, signing in
# with this workflow's GitHub OIDC token (no secret). Stable versions only. It is a
# job of its own so that, if the registry fails, "Re-run failed jobs" retries just it.

on:
  push:
    tags:
      - 'cli-v[0-9]+.[0-9]+.[0-9]+'
      - 'cli-v[0-9]+.[0-9]+.[0-9]+-*'
  # Builds, packs and smoke-tests without publishing (a dry run), or publishes when asked.
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to npm? (false = dry run: build, pack and smoke-test only)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: read

env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

concurrency:
  group: publish-cli
  cancel-in-progress: false

jobs:
  publish:
    name: Build, smoke-test and publish
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # trusted publishing (OIDC) and provenance
    outputs:
      dist_tag: ${{ steps.meta.outputs.dist_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # npm's trusted publishing needs npm 11.5.1 or later: Node 24 ships it.
      # No `registry-url` here: with it, setup-node writes an .npmrc that authenticates with
      # NODE_AUTH_TOKEN (a placeholder when unset), and npm then publishes with that token
      # instead of trusted publishing, which the registry refuses (E404).
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Enable pnpm (Corepack, version from package.json)
        run: corepack enable

      - name: Install dependencies (pnpm workspace)
        run: pnpm install --frozen-lockfile

      - name: Version and channel
        id: meta
        run: |
          VERSION=$(node -p "require('./apps/cli/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME#cli-v}"
            if [ "${TAG%%-*}" != "$VERSION" ]; then
              echo "::error::Tag $GITHUB_REF_NAME doesn't match apps/cli/package.json ($VERSION)"
              exit 1
            fi
            if [[ "$TAG" == *-* ]]; then echo "dist_tag=next" >> "$GITHUB_OUTPUT"; else echo "dist_tag=latest" >> "$GITHUB_OUTPUT"; fi
            if [[ "$TAG" == *-* ]]; then echo "version=$TAG" >> "$GITHUB_OUTPUT"; fi
          else
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the CLI and the packages it bundles
        run: pnpm turbo run build --filter=@codearchy/cli...

      - name: Package (apps/cli/npm)
        run: pnpm --filter @codearchy/cli package

      # A pre-release tag (cli-v0.2.0-next.1) publishes that exact version.
      - name: Set the pre-release version
        if: steps.meta.outputs.dist_tag == 'next'
        working-directory: apps/cli/npm
        run: npm version "${{ steps.meta.outputs.version }}" --no-git-tag-version

      - name: Install the packed package alone and run it
        run: pnpm --filter @codearchy/cli smoke:package

      - name: Not published already
        run: |
          if npm view "codearchy@${{ steps.meta.outputs.version }}" version >/dev/null 2>&1; then
            echo "::error::codearchy@${{ steps.meta.outputs.version }} is already on npm: bump apps/cli/package.json"
            exit 1
          fi

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.publish == 'true'
        working-directory: apps/cli/npm
        run: |
          echo "npm $(npm --version): trusted publishing (OIDC)"
          npm publish --access public --tag "${{ steps.meta.outputs.dist_tag }}"

      # package.mjs writes server.json with this version; the mcp-registry job publishes it.
      - name: Keep server.json for the MCP Registry
        if: (startsWith(github.ref, 'refs/tags/') || github.event.inputs.publish == 'true') && steps.meta.outputs.dist_tag == 'latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mcp-server-json
          path: apps/cli/npm/server.json
          if-no-files-found: error
          retention-days: 7

      - name: Summary
        run: |
          echo "### codearchy@${{ steps.meta.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$GITHUB_REF" == refs/tags/* ]] || [ "${{ github.event.inputs.publish }}" == "true" ]; then
            echo "Published to npm (dist-tag \`${{ steps.meta.outputs.dist_tag }}\`): https://www.npmjs.com/package/codearchy" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Dry run: built, packed and smoke-tested; not published." >> "$GITHUB_STEP_SUMMARY"
          fi

  mcp-registry:
    name: List in the MCP Registry
    needs: publish
    # Stable versions only: a pre-release's server.json would still carry the package.json version.
    if: (startsWith(github.ref, 'refs/tags/') || github.event.inputs.publish == 'true') && needs.publish.outputs.dist_tag == 'latest'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # `mcp-publisher login github-oidc`: grants io.github.CodeArchy/*
    env:
      MCP_PUBLISHER_VERSION: '1.8.16'
      # sha256 of mcp-publisher_linux_amd64.tar.gz, from that release's registry_<version>_checksums.txt.
      MCP_PUBLISHER_SHA256: 6e2f799550cf843c6fd3350498d56cc49be3dc0af1e6237eb0e6435c7a9d5c05
    steps:
      - name: Get server.json
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mcp-server-json
          path: mcp

      - name: Install mcp-publisher (pinned, checksum verified)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/mcp-publisher.tar.gz" \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # The registry checks that npm's package names this server (mcpName), and a new
      # version can take a few minutes to show up on npm after publishing.
      - name: Wait for npm to serve this version
        working-directory: mcp
        run: |
          NAME=$(jq -r .name server.json)
          VERSION=$(jq -r .version server.json)
          for i in $(seq 1 30); do
            if [ "$(npm view "codearchy@${VERSION}" mcpName 2>/dev/null)" = "$NAME" ]; then
              echo "codearchy@${VERSION} on npm names ${NAME}"
              exit 0
            fi
            echo "Waiting for codearchy@${VERSION} on npm ($i/30)…"
            sleep 20
          done
          echo "::error::codearchy@${VERSION} isn't on npm with mcpName ${NAME} after 10 minutes"
          exit 1

      - name: Sign in to the registry (GitHub OIDC)
        run: mcp-publisher login github-oidc

      - name: Publish server.json
        working-directory: mcp
        run: mcp-publisher publish

      - name: Summary
        working-directory: mcp
        run: |
          echo "### MCP Registry" >> "$GITHUB_STEP_SUMMARY"
          echo "Listed $(jq -r .name server.json) $(jq -r .version server.json): https://registry.modelcontextprotocol.io/v0/servers?search=$(jq -r .name server.json)" >> "$GITHUB_STEP_SUMMARY"
